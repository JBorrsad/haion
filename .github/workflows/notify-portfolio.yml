name: Notify Portfolio on Update

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify secret exists
        run: |
          if [ -z "${{ secrets.PORTFOLIO_DISPATCH_TOKEN }}" ]; then
            echo "❌ Error: PORTFOLIO_DISPATCH_TOKEN secret is not set"
            exit 1
          else
            echo "✅ PORTFOLIO_DISPATCH_TOKEN secret is configured"
          fi
      
      - name: Trigger portfolio rebuild
        id: dispatch
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.PORTFOLIO_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/JBorrsad/portfolio/dispatches \
            -d '{"event_type":"project-updated"}')
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          
          echo "Response status: $http_code"
          echo "Response body: $body"
          
          if [ "$http_code" -eq 204 ] || [ "$http_code" -eq 200 ]; then
            echo "✅ Successfully triggered portfolio rebuild"
          else
            echo "❌ Failed to trigger portfolio rebuild"
            echo "Status code: $http_code"
            echo "Response: $body"
            exit 1
          fi
